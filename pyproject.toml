[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ridepay"
version = "1.0.0"
description = "Driver pay pricing for a ride-hailing marketplace, on NYC TLC trip records"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
# Core: what the quote engine needs. Everything else is an extra, so the API image stays small.
dependencies = ["numpy>=1.26,<2.4", "pandas>=2.0,<3", "scipy>=1.11"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
data = ["pyarrow>=14", "duckdb>=1.0"]
models = ["scikit-learn>=1.4", "lightgbm>=4.0", "statsmodels>=0.14", "pymc>=5.10", "arviz>=0.17",
          "holidays>=0.40", "matplotlib>=3.8", "pyshp>=2.3", "shapely>=2.0"]
notebooks = ["nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "matplotlib-inline>=0.1"]
spark = ["pyspark>=3.5"]
dev = ["pytest>=7.4", "ruff>=0.6", "httpx>=0.27"]
all = ["ridepay[api,data,models,notebooks,spark,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]
